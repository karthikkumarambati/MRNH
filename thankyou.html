<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thank You | MRNH</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 20px;

            font-family: "Inter", sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #070f2c,
                    #0b1c4a
                );

            color: #263238;
        }

        .success-card {
            width: min(520px, 100%);

            padding: 50px 35px;

            text-align: center;

            background: #fff;

            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .30);
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            color: #fff;

            background: #f15a24;

            font-size: 36px;
        }

        h1 {
            color: #0b1c4a;

            font-family:
                "Plus Jakarta Sans";

            font-size: 32px;

            margin-bottom: 15px;
        }

        p {
            color: #687386;

            line-height: 1.7;

            margin-bottom: 28px;
        }

        a {
            display: inline-block;

            padding: 14px 28px;

            color: #fff;

            background: #f15a24;

            border-radius: 50px;

            font-weight: 700;

            text-decoration: none;
        }

        a:hover {
            background: #0b1c4a;
        }

    </style>

</head>

<body>

    <div class="success-card">

        <div class="icon">
            ✓
        </div>

        <h1>
            Thank You!
        </h1>

        <p>
            Your callback request has been received.
            Our hospital team will contact you shortly.
        </p>

        <a href="index.html">
            Back to Home
        </a>

    </div>

</body>

</html>
